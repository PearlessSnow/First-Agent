<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电商运营 AI 智能体</title>
<style>
  :root {
    --bg: #f5f7fa; --panel: #fff; --primary: #2563eb; --primary-light: #eff4ff;
    --text: #1f2937; --sub: #6b7280; --border: #e5e7eb;
    --up: #e02020; --down: #16a34a; --warn: #f59e0b; --radius: 12px;
    --shadow: 0 1px 3px rgba(0,0,0,.06);
    --sidebar-w: 220px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
    background: var(--bg); color: var(--text); height: 100vh; overflow: hidden;
  }
  .layout { display: flex; height: 100vh; }

  /* ===== 左侧固定菜单 ===== */
  .sidebar {
    width: var(--sidebar-w); height: 100vh; flex-shrink: 0;
    background: var(--panel); border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    padding: 20px 18px; border-bottom: 1px solid var(--border);
  }
  .brand .mark {
    width: 34px; height: 34px; border-radius: 8px;
    background: var(--primary); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 800;
  }
  .brand .t { font-size: 15px; font-weight: 700; line-height: 1.3; }
  .brand .t small { display: block; font-size: 11px; color: var(--sub); font-weight: 400; }
  .menu { padding: 12px 0; flex: 1; }
  .menu-item {
    display: flex; align-items: center; gap: 12px;
    padding: 13px 18px; font-size: 14px; cursor: pointer;
    color: var(--sub); border-left: 3px solid transparent; transition: all .15s;
  }
  .menu-item:hover { background: var(--primary-light); color: var(--primary); }
  .menu-item.active {
    background: var(--primary-light); color: var(--primary);
    border-left: 3px solid var(--primary); font-weight: 600;
  }
  .menu-item .dot { width: 8px; height: 8px; border-radius: 2px; background: #cbd5e1; }
  .menu-item.active .dot { background: var(--primary); }
  .menu-item .badge {
    margin-left: auto; background: var(--up); color: #fff;
    font-size: 11px; padding: 1px 7px; border-radius: 10px;
  }
  .sidebar .foot {
    padding: 14px 18px; border-top: 1px solid var(--border);
    font-size: 11px; color: var(--sub); line-height: 1.7;
  }

  /* ===== 右侧主内容区 ===== */
  .main { flex: 1; padding: 24px; overflow-y: auto; min-width: 0; }
  .section { display: none; }
  .section.active { display: block; animation: fade .25s; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } }

  .section-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 20px; }
  .section-head h2 { font-size: 20px; font-weight: 700; }
  .section-head .sub { font-size: 13px; color: var(--sub); }
  .section-head .tag {
    margin-left: auto; font-size: 12px; color: var(--warn);
    background: #fffbeb; border: 1px solid #fde68a; padding: 4px 10px; border-radius: 6px;
  }

  /* KPI 卡片 */
  .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; }
  .kpi {
    background: var(--panel); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 18px 20px; border: 1px solid var(--border);
  }
  .kpi .label { font-size: 13px; color: var(--sub); margin-bottom: 8px; }
  .kpi .value { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
  .kpi .delta { font-size: 12px; margin-top: 8px; display: flex; align-items: center; gap: 4px; }
  .delta.up { color: var(--up); } .delta.down { color: var(--down); }
  .delta .vs { color: var(--sub); }
  .kpi.alert .value { color: var(--warn); }

  /* 图表区 */
  .chart-card {
    background: var(--panel); border-radius: var(--radius); box-shadow: var(--shadow);
    border: 1px solid var(--border); padding: 20px;
  }
  .chart-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .chart-sub { font-size: 12px; color: var(--sub); margin-bottom: 16px; }
  .chart-box { height: 280px; }
  .axis-label { font-size: 10px; fill: #9ca3af; }
  .grid-line { stroke: #eef1f5; stroke-width: 1; }

  /* ===== AI 对话中心（全屏聊天） ===== */
  .chat-section {
    display: none; height: 100%; flex-direction: column;
  }
  .chat-section.active { display: flex; animation: fade .25s; }
  .chat-shell {
    flex: 1; display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden;
  }
  .chat-head {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 20px; border-bottom: 1px solid var(--border);
  }
  .chat-head .ai-avatar {
    width: 32px; height: 32px; border-radius: 8px;
    background: linear-gradient(135deg, #2563eb, #7c3aed); color: #fff;
    font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center;
  }
  .chat-head .name { font-size: 15px; font-weight: 700; }
  .chat-head .hint { font-size: 12px; color: var(--sub); }
  .chat-head .btn-clear {
    margin-left: auto; border: 1px solid var(--border); background: var(--bg);
    border-radius: 8px; padding: 7px 14px; font-size: 13px; cursor: pointer; color: var(--sub);
  }
  .chat-head .btn-clear:hover { color: var(--up); border-color: #fecaca; }

  /* 历史对话侧栏 */
  .chat-body { flex: 1; display: flex; min-height: 0; }
  .conv-panel {
    width: 250px; flex-shrink: 0; border-right: 1px solid var(--border);
    display: flex; flex-direction: column; background: var(--panel);
  }
  .btn-new {
    margin: 12px; padding: 9px 0; border: 1px dashed var(--primary);
    color: var(--primary); background: var(--primary-light);
    border-radius: 8px; font-size: 13px; cursor: pointer; font-weight: 600;
  }
  .btn-new:hover { background: #dbe7fe; }
  .conv-list { flex: 1; overflow-y: auto; padding: 0 10px 10px; }
  .conv-list-title {
    font-size: 11px; color: var(--sub); padding: 4px 4px 8px;
    display: flex; justify-content: space-between;
  }
  .conv-item {
    padding: 10px 12px; border-radius: 8px; cursor: pointer; margin-bottom: 6px;
    border: 1px solid transparent; position: relative;
  }
  .conv-item:hover { background: var(--bg); }
  .conv-item.active { background: var(--primary-light); border-color: #c7d7fe; }
  .conv-item .t {
    font-size: 13px; font-weight: 600; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; padding-right: 18px;
  }
  .conv-item .m { font-size: 11px; color: var(--sub); margin-top: 3px; }
  .conv-item .del {
    position: absolute; top: 8px; right: 8px; border: none; background: none;
    color: #c0c4cc; cursor: pointer; font-size: 14px; line-height: 1; padding: 2px;
  }
  .conv-item .del:hover { color: var(--up); }
  .conv-empty { font-size: 12px; color: var(--sub); text-align: center; padding: 20px 0; line-height: 1.8; }
  .chat-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .chat-messages {
    flex: 1; overflow-y: auto; padding: 20px 24px;
    display: flex; flex-direction: column; gap: 14px; background: var(--bg);
  }
  .msg { max-width: 82%; padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.9; word-break: break-word; }
  .msg.user { align-self: flex-end; background: var(--primary); color: #fff; border-top-right-radius: 3px; white-space: pre-wrap; }
  .msg.bot {
    align-self: flex-start; background: var(--panel);
    border: 1px solid var(--border); border-top-left-radius: 3px;
  }
  .msg.bot .who { font-size: 11px; color: var(--primary); font-weight: 600; margin-bottom: 4px; }
  .msg.bot.err { border-color: #fecaca; background: #fef2f2; }
  .msg.bot .cursor {
    display: inline-block; width: 8px; height: 15px; background: var(--primary);
    vertical-align: -2px; margin-left: 2px; animation: blink .8s infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .chat-input-area { padding: 16px 20px; border-top: 1px solid var(--border); background: var(--panel); }
  .chat-input-row { display: flex; gap: 10px; align-items: flex-end; }
  .chat-input-area textarea {
    flex: 1; resize: none; border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; font-size: 14px; font-family: inherit; outline: none;
    line-height: 1.6; height: 76px; transition: border .15s;
  }
  .chat-input-area textarea:focus { border-color: var(--primary); }
  .chat-tips { font-size: 12px; color: var(--sub); margin-top: 8px; display: flex; gap: 16px; }
  .btn {
    border: none; border-radius: 10px; padding: 12px 24px; font-size: 14px;
    font-weight: 600; cursor: pointer;
  }
  .btn-send { background: var(--primary); color: #fff; }
  .btn-send:hover { background: #1d4ed8; }
  .btn-send:disabled { background: #93c5fd; cursor: not-allowed; }
  .btn-stop { background: var(--bg); color: var(--sub); border: 1px solid var(--border); display: none; }
</style>
</head>

/* SVG 柱状图（纯静态，不调用后端） */
function drawBar(chart) {
  const W = 900, H = 280, padL = 20, padB = 34, padT = 20;
  const vals = chart.data, max = Math.max(...vals) * 1.15, n = vals.length;
  const bw = Math.min(64, (W - padL * 2) / n * 0.45);
  let grid = "", bars = "";
  for (let i = 0; i <= 4; i++) {
    const y = padT + (H - padT - padB) / 4 * i;
    grid += `<line class="grid-line" x1="${padL}" y1="${y}" x2="${W - padL}" y2="${y}"/>`;
  }
  const fmt = v => v >= 10000 ? (v / 10000).toFixed(1) + "w" : v.toLocaleString();
  vals.forEach((v, i) => {
    const cx = padL + (W - padL * 2) / n * (i + 0.5);
    const h = (H - padT - padB) * v / max, y = H - padB - h;
    const hot = v === Math.max(...vals);
    bars += `
      <rect x="${cx - bw / 2}" y="${y}" width="${bw}" height="${h}" rx="5"
        fill="${hot ? COLOR.primary : "#bfdbfe"}" opacity="0.92"/>
      <text x="${cx}" y="${y - 8}" text-anchor="middle"
        style="font-size:11px;font-weight:600;fill:${hot ? COLOR.primary : COLOR.sub}">${fmt(v)}</text>
      <text x="${cx}" y="${H - 12}" text-anchor="middle" class="axis-label">${chart.labels[i]}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">${grid}${bars}</svg>`;
}

  const ta = document.getElementById("chat-input");
  ta.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
}

let abortCtrl = null;

function addMsg(role, text) {
  const box = document.getElementById("chat-messages");
  const div = document.createElement("div");
  div.className = "msg " + role;
  if (role === "bot") {
    div.innerHTML = '<div class="who">AI 运营助手</div><div class="body"></div>';
    div.querySelector(".body").innerHTML = text ?? "";
  } else {
    div.textContent = text;
  }
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
  return role === "bot" ? div.querySelector(".body") : div;
}

/* 基础 Markdown：先转义 HTML，再加粗 **xx**、换行 */
function mdRender(text) {
  let s = String(text)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  s = s.replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>");
  s = s.replace(/\n/g, "<br>");
  return s;
}

/* ===== 历史对话模块（服务端 /api/conversations 持久化） ===== */

function fmtTime(ts) {
  const d = new Date(ts * 1000);
  const p = n => String(n).padStart(2, "0");
  return `${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function newConversation() {
  if (streaming) return;
  currentConvId = null;
  CHAT_HISTORY = [];
  const box = document.getElementById("chat-messages");
  box.innerHTML = "";
  addMsg("bot", "已开启**新对话**。全店六大板块看板数据已注入上下文，请提问。");
  renderConvList(convCache);
}

let convCache = []; // 最近一次拉取的历史列表

async function loadConversations() {
  try {
    const res = await fetch("/api/conversations");
    if (!res.ok) return;
    const data = await res.json();
    convCache = data.conversations || [];
    renderConvList(convCache);
  } catch (e) { /* 网络异常时保留现有列表 */ }
}

function renderConvList(items) {
  const list = document.getElementById("conv-list");
  if (!list) return;
  if (!items.length) {
    list.innerHTML = '<div class="conv-empty">暂无历史对话<br>发送第一条提问后自动保存</div>';
    return;
  }
  let html = '<div class="conv-list-title"><span>历史对话</span><span>' + items.length + ' 个</span></div>';
  items.forEach(c => {
    html += `
      <div class="conv-item${c.id === currentConvId ? " active" : ""}" data-id="${c.id}">
        <div class="t">${escHtml(c.title)}</div>
        <div class="m">${fmtTime(c.updated_at)} · ${c.message_count} 条</div>
        <button class="del" title="删除对话" data-id="${c.id}">×</button>
      </div>`;
  });
  list.innerHTML = html;
}

function escHtml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

async function selectConversation(id) {
  if (streaming || id === currentConvId) return;
  try {
    const res = await fetch("/api/conversations/" + id);
    if (!res.ok) { loadConversations(); return; }
    const data = await res.json();
    currentConvId = id;
    CHAT_HISTORY = (data.messages || []).map(m => ({ role: m.role, content: m.content }));
    const box = document.getElementById("chat-messages");
    box.innerHTML = "";
    if (!CHAT_HISTORY.length) {
      addMsg("bot", "该对话暂无消息。");
    } else {
      CHAT_HISTORY.forEach(m => {
        if (m.role === "user") addMsg("user", m.content);
        else addMsg("bot", mdRender(m.content));
      });
    }
    renderConvList(convCache);
  } catch (e) {
    addMsg("bot", "⚠ 历史对话加载失败，请稍后重试。").parentElement.classList.add("err");
  }
}

async function deleteConversation(id) {
  if (streaming) return;
  if (!confirm("确认删除这条历史对话？删除后不可恢复。")) return;
  try {
    await fetch("/api/conversations/" + id, { method: "DELETE" });
    if (currentConvId === id) newConversation();
    await loadConversations();
  } catch (e) { alert("删除失败，请稍后重试。"); }
}

function bindConvList() {
  document.getElementById("conv-list").addEventListener("click", e => {
    const del = e.target.closest(".del");
    if (del) { e.stopPropagation(); deleteConversation(del.dataset.id); return; }
    const item = e.target.closest(".conv-item");
    if (item) selectConversation(item.dataset.id);
  });
}

/* 发送：POST /api/chat，body 含 messages（历史）与 store_data（看板数据） */
async function sendMessage() {
  const ta = document.getElementById("chat-input");
  const q = ta.value.trim();
  if (!q || streaming) return;
  ta.value = "";
  addMsg("user", q);

  const body = document.querySelector("#sec-chat .msg.bot:last-child") || null;
  const botBody = addMsg("bot", '<span class="cursor"></span>');
  const bubble = botBody.parentElement;
  streaming = true;
  document.getElementById("btn-send").disabled = true;
  document.getElementById("btn-stop").style.display = "inline-block";
  document.body.querySelector("#main").scrollTop = 0;

  /* 打字机：目标文本 target 已到达长度，shown 为已渲染长度，定时追赶 */
  let target = "", shown = 0, finished = false;
  const box = document.getElementById("chat-messages");
  const timer = setInterval(() => {
    if (shown < target.length) {
      shown = Math.min(target.length, shown + 3);
      botBody.innerHTML = mdRender(target.slice(0, shown)) + (finished ? "" : '<span class="cursor"></span>');
      box.scrollTop = box.scrollHeight;
    } else if (finished) {
      botBody.innerHTML = mdRender(target);
      clearInterval(timer);
    }
  }, 20);

  abortCtrl = new AbortController();
  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        messages: [...CHAT_HISTORY, { role: "user", content: q }],
        store_data: STORE_DATA,
        conversation_id: currentConvId,   // null = 新对话，由服务端创建
      }),
      signal: abortCtrl.signal,
    });
    if (!res.ok) {
      let err = "请求失败（HTTP " + res.status + "）";
      try { const j = await res.json(); err = j.error || err; } catch (e) {}
      throw new Error(err);
    }
    currentConvId = res.headers.get("X-Conversation-Id") || currentConvId;
    const reader = res.body.getReader();
    const decoder = new TextDecoder("utf-8");
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      target += decoder.decode(value, { stream: true });
    }
    target += decoder.decode();
    if (!target.trim()) target = "（模型未返回内容，请重试）";
    if (target.includes("[ERROR]")) {
      bubble.classList.add("err");
    } else {
      // 回复完整才计入本地上下文（错误文本不进入后续对话）
      CHAT_HISTORY.push({ role: "user", content: q }, { role: "assistant", content: target });
    }
  } catch (err) {
    bubble.classList.add("err");
    target = (target ? target + "\n\n" : "") + "⚠ " + (err.name === "AbortError" ? "已停止生成。" : err.message);
  } finally {
    finished = true;
    streaming = false;
    abortCtrl = null;
    document.getElementById("btn-send").disabled = false;
    document.getElementById("btn-stop").style.display = "none";
    loadConversations(); // 刷新历史对话侧栏（标题/条数/排序）
  }
}

/* ============ 菜单切换 ============ */
document.getElementById("menu").addEventListener("click", e => {
  const item = e.target.closest(".menu-item");
  if (!item) return;
  document.querySelectorAll(".menu-item").forEach(m => m.classList.remove("active"));
  item.classList.add("active");
  document.querySelectorAll(".section, .chat-section").forEach(s => s.classList.remove("active"));
  document.getElementById("sec-" + item.dataset.sec).classList.add("active");
});

renderDashboards();
buildChatSection();
bindConvList();
addMsg("bot", "你好，我是 AI 运营助手。已读取全店六大板块看板数据（订单 / 销售 / 物流 / 成本 / 客服 / 类目）。\n\n可以直接问我，例如：结合成本和销售数据，分析一下本周利润为什么下滑？\n\n左侧「历史对话」栏可查看、继续或删除过往会话（服务端自动保存）。");
loadConversations();
</script>
